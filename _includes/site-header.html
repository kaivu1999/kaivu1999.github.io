<a class="ks-skip" href="#site-content">Skip to content</a>
<header class="ks-header">
  <div class="ks-wrap ks-header-inner">
    <a class="ks-brand" href="{{ '/' | relative_url }}">Kaivalya<span>.</span></a>
    <nav class="ks-nav" aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
        {% assign section = item.url | split: '/' | slice: 1 | first %}
        {% assign current_section = page.url | split: '/' | slice: 1 | first %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif section == current_section %} aria-current="location"{% endif %}>{{ item.title | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
